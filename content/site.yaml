events:
  kicker: Événements & ateliers
  title: Les prochains rendez-vous
  lead: "Dimanche 27 septembre 2026 - Inscrivez-vous, c'est gratuit pour l'édition
    #JAIFAIMJEMANGE2026 en remplissant le formulaire correspondant à
    Brive-la-gaillarde. Sur inscription uniquement. "
  button_href: "#contact"
  button_text: Voir tous les événements
  cards:
    - image: assets/images/jaifaim.png
      meta: "10H30 devant la mairie de Brive-la-gailarde "
      title: "#JAIFAIMJEMANGE2026"
      link_href: https://www.jaifaimjemange.fr/inscription-2025
      link_text: Découvrir l'événement
      text: "Et si on mettait en lumière toutes les façons de nourrir nos enfants ? En
        septembre 2026, l'édition #JAIFAIMJEMANGE revient partout en France pour
        célébrer l'allaitement, le biberon et tous ces moments où l'on nourrit
        son enfant."
      more: >-
        J’ai faim, je mange, c’est un événement photographique national qui met
        en lumière un geste aussi simple qu’essentiel : nourrir son enfant.


        Allaitement, biberon, diversification… derrière chaque famille se trouve une histoire différente, et toutes méritent d’être représentées.


        À travers des rassemblements organisés dans plusieurs villes de France, parents, enfants et photographes se retrouvent pour créer des images naturelles, fortes et bienveillantes autour de l’alimentation des tout-petits.


        À Brive-la-Gaillarde, rendez-vous le dimanche 27 septembre 2026 ! Je vous accueillerai pour un moment convivial suivi d’une séance photo collective et de prises de vues plus naturelles au parc de la Guierle.


        La participation est gratuite, sur inscription. Les bébés et enfants de tous âges sont les bienvenus, ainsi que les conjoint(e)s, frères et sœurs. 


        Retrouvez l’événement de Brive sur la carte et inscrivez-vous pour participer !
