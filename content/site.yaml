faq:
  - question: Comment se déroule une première séance ?
    answer: "Je vous propose un rendez-vous téléphonique pour faire le point sur
      votre demande et préparer la séance de rencontre. Lors de notre première
      séance nous prenons le temps d'évaluer votre situation afin de vous
      proposer un accompagnement adapté et personnalisé. Aucun engagement n'est
      demandé à l'issue de cette première séance. "
  - question: Les séances sont-elles remboursées ?
    answer: Seule la mise en place de tire lait à domicile et la séance d'échange
      autour de l'allaitement sont prises en charge par la sécurité sociale
      (sous présentation d'une ordonnance, d'une carte vitale et d'une
      mutuelle). L’accompagnement parental relève en général du secteur non
      médicalisé et n’est pas pris en charge par la Sécurité sociale.
      Renseignez-vous auprès de votre mutuelle.
  - question: Proposez-vous du visio ?
    answer: Oui, les séances peuvent avoir lieu en visioconférence si vous préférez
      ou si vous êtes éloigné·e géographiquement.
  - question: Comment annuler ou reporter ?
    answer: Merci de prévenir au moins 24 h à l’avance par mail ou message, afin de
      proposer le créneau à une autre famille.
  - question: "Où se déroulent les séances ? "
    answer: |-
      Actuellement, un lieu d'accueil est en cours de création. 
      Les prestations sont proposées à votre domicile ou par visio. 
  - question: "Proposez vous des cartes cadeaux ? "
    answer: "Oui, il suffit de me contacter via le formulaire de contact, par mail
      ou par Instagram. Nous échangeons sur la prestation souhaitée et je vous
      propose de recevoir la carte par voie postale, par mail en pdf ou en dépôt
      de boîte aux lettres sur Brive-La-Gaillarde. "
