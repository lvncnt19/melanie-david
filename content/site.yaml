faq:
  - question: Comment se déroule une première séance ?
    answer: Un temps d’accueil pour faire connaissance, préciser vos attentes et
      définir ensemble un premier axe de travail, dans le respect de votre
      rythme.
  - question: Les séances sont-elles remboursées ?
    answer: L’accompagnement parental relève en général du secteur non médicalisé et
      n’est pas pris en charge par la Sécurité sociale. Renseignez-vous auprès
      de votre mutuelle.
  - question: Puis-je venir avec mon enfant ?
    answer: "Cela dépend de la formule : certaines séances sont réservées aux
      parents, d’autres incluent l’enfant. Nous le clarifions avant le
      rendez-vous."
  - question: Proposez-vous du visio ?
    answer: Oui, les séances peuvent avoir lieu en visioconférence si vous préférez
      ou si vous êtes éloigné·e géographiquement.
  - question: Comment annuler ou reporter ?
    answer: Merci de prévenir au moins 24 h à l’avance par mail ou message, afin de
      proposer le créneau à une autre famille.
